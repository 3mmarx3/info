<!-- settings.html (التطبيق الكامل مع القائمة التفاعلية ونظام الإضافة الحقيقي بالـ Blur والـ Modal) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbix — Active Social Links & Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c8f331;
    --ink: #0d0e10;
    --bg: #f4f5f7;
  }
  * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
  body { background: #e5e7eb; margin: 0; }
  
  .app-container {
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
    padding-bottom: 110px;
  }
  .scroll-area::-webkit-scrollbar { display: none; }
  
  .toggle {
    width: 44px; height: 26px; border-radius: 999px; position: relative; transition: .2s; cursor: pointer;
    border: none; outline: none; background: #e3e5e9;
  }
  .toggle .knob {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle.on .knob { left: 21px; }
  
  .card-shadow { box-shadow: 0 1px 2px rgba(16,17,18,.04), 0 8px 24px rgba(16,17,18,.05); }
  .navbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b7bac0; text-decoration: none; }
  .navbtn.active { color: #101112; }

  /* Blur & Modal */
  .blur-target {
    transition: filter 0.3s ease;
  }
  .blur-target.is-blurred {
    filter: blur(8px);
    pointer-events: none;
  }
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-sheet {
    background: #ffffff;
    width: 100%;
    border-top-left-radius: 32px;
    border-top-right-radius: 32px;
    padding: 24px 20px 40px 20px;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
  }
  .modal-overlay.open .modal-sheet {
    transform: translateY(0);
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Main Content (Gets Blurred when Modal opens) -->
  <div id="main-content" class="blur-target flex flex-col min-h-screen relative">
    
    <!-- Status Bar -->
    <div class="px-7 pt-4 pb-1 flex items-center justify-between text-[15px] font-semibold text-[#101112]">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#101112"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#101112"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#101112"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#101112"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.6a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8z" fill="#101112"/><path d="M8 6.4c-1.7 0-3.3.6-4.6 1.7l1.3 1.5A5 5 0 018 8.4c1.3 0 2.5.4 3.4 1.2l1.3-1.5A6.9 6.9 0 008 6.4z" fill="#101112"/><path d="M8 2.8c-2.7 0-5.2 1-7.1 2.7l1.3 1.5A8.7 8.7 0 018 5c2.1 0 4 .7 5.5 2l1.3-1.5C12.9 3.7 10.6 2.8 8 2.8z" fill="#101112"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#101112"/><rect x="2" y="2" width="18" height="8" rx="1.3" fill="#101112"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="#101112"/></svg>
      </div>
    </div>

    <div class="scroll-area px-5 pt-1">
      
      <!-- Top Bar -->
      <div class="flex items-center justify-between py-3">
        <button class="w-10 h-10 rounded-full bg-white card-shadow flex items-center justify-center" onclick="window.location.href='index.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#101112" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 class="text-[17px] font-bold text-[#101112]">Active social link</h1>
        <div class="w-10"></div>
      </div>

      <!-- Active All Toggle Section -->
      <div class="bg-white rounded-[24px] card-shadow px-5 py-4 mt-2 flex items-center justify-between">
        <span class="text-[14px] font-bold text-[#101112]">Active all</span>
        <button id="active-all-toggle" class="toggle on"><span class="knob"></span></button>
      </div>

      <!-- Active Social Links List (Dynamic) -->
      <div id="active-links-container" class="bg-white rounded-[28px] card-shadow px-5 py-4 mt-3.5 space-y-4">
        
        <!-- Facebook -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#1877F2] flex items-center justify-center text-white font-bold text-[15px]">f</div>
            <span class="text-[14px] font-semibold text-[#101112]">Facebook</span>
          </div>
          <button class="toggle on social-toggle"><span class="knob"></span></button>
        </div>

        <!-- LinkedIn -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#0A66C2] flex items-center justify-center text-white font-bold text-[12px]">in</div>
            <span class="text-[14px] font-semibold text-[#101112]">LinkedIn</span>
          </div>
          <button class="toggle on social-toggle"><span class="knob"></span></button>
        </div>

        <!-- Twitter -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#1DA1F2] flex items-center justify-center text-white font-bold text-[13px]">t</div>
            <span class="text-[14px] font-semibold text-[#101112]">Twitter</span>
          </div>
          <button class="toggle on social-toggle"><span class="knob"></span></button>
        </div>

        <!-- SnapChat -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#FFFC00] flex items-center justify-center text-black font-bold text-[13px]">S</div>
            <span class="text-[14px] font-semibold text-[#101112]">SnapChat</span>
          </div>
          <button class="toggle on social-toggle"><span class="knob"></span></button>
        </div>

        <!-- Pinterest -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#E60023] flex items-center justify-center text-white font-bold text-[13px]">P</div>
            <span class="text-[14px] font-semibold text-[#101112]">Pinterest</span>
          </div>
          <button class="toggle on social-toggle"><span class="knob"></span></button>
        </div>

      </div>

      <!-- Add New Social Link Button -->
      <div class="mt-4 flex justify-center">
        <button id="main-add-btn" class="bg-[#101112] text-white text-[13.5px] font-semibold px-6 py-3 rounded-full shadow-md flex items-center gap-2 hover:bg-black transition">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#c8f331" stroke-width="2.2" stroke-linecap="round"/></svg>
          Add new social link
        </button>
      </div>

      <!-- Recommends For You (Unactivated items waiting to be added) -->
      <div class="mt-6">
        <p class="text-[14px] font-bold text-[#101112] mb-3">Recommends for you</p>
        
        <div id="recommends-container" class="bg-white rounded-[28px] card-shadow px-5 py-4 space-y-4">
          
          <!-- Instagram -->
          <div class="recommend-item flex items-center justify-between" data-name="Instagram" data-color="linear-gradient(to top right, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5)" data-icon="📷">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-[13px]" style="background: linear-gradient(to top right, #feda75, #d62976, #4f5bd5);">📷</div>
              <span class="text-[14px] font-semibold text-[#101112]">Instagram</span>
            </div>
            <button class="add-rec-btn w-8 h-8 rounded-full bg-[#f4f5f7] flex items-center justify-center text-[#101112] font-bold text-lg hover:bg-[#e2e4e9] transition">+</button>
          </div>

          <!-- TikTok -->
          <div class="recommend-item flex items-center justify-between" data-name="TikTok" data-color="#000000" data-icon="♪">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-black text-white flex items-center justify-center font-bold text-[13px]">♪</div>
              <span class="text-[14px] font-semibold text-[#101112]">TikTok</span>
            </div>
            <button class="add-rec-btn w-8 h-8 rounded-full bg-[#f4f5f7] flex items-center justify-center text-[#101112] font-bold text-lg hover:bg-[#e2e4e9] transition">+</button>
          </div>

          <!-- Dribbble -->
          <div class="recommend-item flex items-center justify-between" data-name="Dribbble" data-color="#ea4c89" data-icon="D">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-[#ea4c89] text-white flex items-center justify-center font-bold text-[13px]">D</div>
              <span class="text-[14px] font-semibold text-[#101112]">Dribbble</span>
            </div>
            <button class="add-rec-btn w-8 h-8 rounded-full bg-[#f4f5f7] flex items-center justify-center text-[#101112] font-bold text-lg hover:bg-[#e2e4e9] transition">+</button>
          </div>

          <!-- Behance -->
          <div class="recommend-item flex items-center justify-between" data-name="Behance" data-color="#0054ff" data-icon="Be">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-[#0054ff] text-white flex items-center justify-center font-bold text-[12px]">Be</div>
              <span class="text-[14px] font-semibold text-[#101112]">Behance</span>
            </div>
            <button class="add-rec-btn w-8 h-8 rounded-full bg-[#f4f5f7] flex items-center justify-center text-[#101112] font-bold text-lg hover:bg-[#e2e4e9] transition">+</button>
          </div>

        </div>
      </div>

    </div>

    <!-- Bottom Nav -->
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] px-6 pt-3 pb-7 flex items-center justify-between shadow-[0_-8px_24px_rgba(16,17,18,0.06)] z-20">
      <a href="index.html" class="navbtn">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
      </a>
      <a href="#" class="navbtn active">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V20a2 2 0 11-4 0v-.2a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H4a2 2 0 110-4h.2a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H10a1.7 1.7 0 001-1.6V4a2 2 0 114 0v.2a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V10a1.7 1.7 0 001.6 1H20a2 2 0 110 4h-.2a1.7 1.7 0 00-1.6 1z" stroke="currentColor" stroke-width="1.4"/></svg>
      </a>
      <a href="credit.html" class="bg-[#101112] text-white rounded-full px-5 py-3 flex items-center gap-2 -mt-1 no-underline transition hover:scale-105">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="#c8f331" stroke-width="1.7"/><path d="M3 10h18" stroke="#c8f331" stroke-width="1.7"/></svg>
        <span class="text-[13px] font-semibold">Cards</span>
      </a>
      <a href="#" class="navbtn">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </a>
      <a href="#" class="navbtn">
        <img src="https://i.pravatar.cc/60?img=13" class="w-6 h-6 rounded-full object-cover ring-2 ring-[#eef0f2]"/>
      </a>
    </div>

  </div>

  <!-- Modal Overlay with Blur Support -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal-sheet">
      
      <!-- Icon & Header -->
      <div class="flex flex-col items-center">
        <div id="modal-icon-box" class="w-14 h-14 rounded-full bg-black flex items-center justify-center text-white shadow-md mb-2 font-bold text-xl">
          ♪
        </div>
        <h3 id="modal-title-text" class="text-[18px] font-extrabold text-[#101112]">TikTok</h3>
      </div>

      <!-- Inputs for Name and URL -->
      <div class="mt-5 space-y-3">
        <div>
          <label class="text-[11px] font-bold text-[#9a9ea6] uppercase tracking-wider">Platform name</label>
          <input type="text" id="input-platform-name" value="TikTok" class="w-full mt-1 bg-[#f4f5f7] border border-[#e3e5e9] rounded-xl px-4 py-3 text-[14px] font-semibold text-[#101112] outline-none focus:border-[#101112]" />
        </div>
        <div>
          <label class="text-[11px] font-bold text-[#9a9ea6] uppercase tracking-wider">Platform url</label>
          <input type="text" id="input-platform-url" placeholder="www.platform.com/username" class="w-full mt-1 bg-[#f4f5f7] border border-[#e3e5e9] rounded-xl px-4 py-3 text-[14px] text-[#101112] outline-none focus:border-[#101112]" />
        </div>
      </div>

      <!-- Save Link Button -->
      <button id="save-link-btn" class="w-full mt-6 bg-[#101112] hover:bg-black text-white text-[14px] font-semibold py-4 rounded-full transition shadow-lg">
        Save link
      </button>
    </div>
  </div>

</div>

<script>
  const mainContent = document.getElementById('main-content');
  const addModal = document.getElementById('add-modal');
  const modalIconBox = document.getElementById('modal-icon-box');
  const modalTitleText = document.getElementById('modal-title-text');
  const inputPlatformName = document.getElementById('input-platform-name');
  const inputPlatformUrl = document.getElementById('input-platform-url');
  const saveLinkBtn = document.getElementById('save-link-btn');
  const activeLinksContainer = document.getElementById('active-links-container');

  let currentSelectedItem = null;

  // Global Toggles Logic
  const activeAllToggle = document.getElementById('active-all-toggle');
  
  function updateTogglesListeners() {
    const socialToggles = document.querySelectorAll('.social-toggle');
    socialToggles.forEach(toggle => {
      toggle.onclick = function() {
        this.classList.toggle('on');
      };
    });
  }
  updateTogglesListeners();

  activeAllToggle.onclick = function() {
    this.classList.toggle('on');
    const isOn = this.classList.contains('on');
    document.querySelectorAll('.social-toggle').forEach(toggle => {
      if (isOn) toggle.classList.add('on');
      else toggle.classList.remove('on');
    });
  };

  // Open Modal when clicking '+' on any Recommended unactivated item
  document.querySelectorAll('.add-rec-btn').forEach(btn => {
    btn.onclick = function(e) {
      e.stopPropagation();
      const item = this.closest('.recommend-item');
      currentSelectedItem = item;
      
      const name = item.getAttribute('data-name');
      const color = item.getAttribute('data-color');
      const iconText = item.getAttribute('data-icon');

      // Populate Modal Fields
      modalTitleText.innerText = name;
      inputPlatformName.value = name;
      inputPlatformUrl.value = '';
      inputPlatformUrl.placeholder = `www.${name.toLowerCase()}.com/username`;
      
      modalIconBox.style.background = color;
      modalIconBox.innerText = iconText;

      // Show modal & blur background
      addModal.classList.add('open');
      mainContent.classList.add('is-blurred');
    };
  });

  // Generic Add Button
  document.getElementById('main-add-btn').onclick = function() {
    modalTitleText.innerText = "Custom Link";
    inputPlatformName.value = "";
    inputPlatformUrl.value = "";
    inputPlatformUrl.placeholder = "www.website.com/profile";
    modalIconBox.style.background = "#101112";
    modalIconBox.innerText = "🔗";
    currentSelectedItem = null;

    addModal.classList.add('open');
    mainContent.classList.add('is-blurred');
  };

  // Save Link Button Action (Moves item from Recommended to Active and removes blur)
  saveLinkBtn.onclick = function() {
    const name = inputPlatformName.value || "New Link";
    const iconBg = modalIconBox.style.background || "#101112";
    const iconTxt = modalIconBox.innerText || "🔗";

    // Create new active link row element
    const newActiveRow = document.createElement('div');
    newActiveRow.className = "flex items-center justify-between";
    newActiveRow.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-[13px]" style="background: ${iconBg};">${iconTxt}</div>
        <span class="text-[14px] font-semibold text-[#101112]">${name}</span>
      </div>
      <button class="toggle on social-toggle"><span class="knob"></span></button>
    `;

    activeLinksContainer.appendChild(newActiveRow);
    updateTogglesListeners();

    // Remove from recommends if it was selected from there
    if (currentSelectedItem) {
      currentSelectedItem.remove();
    }

    // Close modal & remove blur
    addModal.classList.remove('open');
    mainContent.classList.remove('is-blurred');
  };

  // Close modal when clicking outside sheet
  addModal.onclick = function(e) {
    if (e.target === addModal) {
      addModal.classList.remove('open');
      mainContent.classList.remove('is-blurred');
    }
  };
</script>
</body>
</html>
