<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbix - Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { font-family: 'Plus Jakarta Sans', sans-serif; }
  body { background: #E5E7EB; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .app-container { 
    max-width: 414px; width: 100%; margin: 0 auto; 
    background: #F4F5F7; min-height: 100vh; position: relative; 
    overflow-y: auto; overflow-x: hidden; 
    -ms-overflow-style: none; scrollbar-width: none; 
  }
  .app-container::-webkit-scrollbar { display: none; }
  
  .toggle-checkbox:checked { right: 0; border-color: #ffffff; }
  .toggle-checkbox:checked + .toggle-label { background-color: #c8f331; }
  .toggle-checkbox { right: 20px; z-index: 1; border-color: #ffffff; transition: all 0.2s; }
  .toggle-label { width: 44px; height: 26px; background-color: #E3E5E9; border-radius: 9999px; transition: all 0.2s; }
  .toggle-thumb { width: 20px; height: 20px; background-color: white; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: all 0.2s; }
  .toggle-checkbox:checked ~ .toggle-thumb { transform: translateX(18px); }
  
  .navbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9A9EA6; transition: color 0.2s; }
  .navbtn.active { color: #101112; }

  @keyframes smoothSpringDown {
    0% { opacity: 0; transform: translateY(-40px) scale(0.96); }
    50% { opacity: 1; transform: translateY(6px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  @keyframes smoothSlideUp {
    0% { opacity: 0; transform: translateY(25px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes smoothPopIn {
    0% { opacity: 0; transform: scale(0.85); }
    60% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes radarPulseSoft {
    0% { transform: scale(1); opacity: 0.4; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .anim-profile { animation: smoothSpringDown 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .anim-add-new { opacity: 0; animation: smoothPopIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards; }
  .anim-cards { opacity: 0; animation: smoothSlideUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards; }
  .anim-nav { opacity: 0; animation: smoothSlideUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.45s forwards; }

  .radar-btn { position: relative; z-index: 10; }
  .radar-btn::before, .radar-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-color: #ffffff;
    z-index: -1;
    animation: radarPulseSoft 3s ease-out infinite;
  }
  .radar-btn::after { animation-delay: 1.5s; }
  .radar-btn svg { position: relative; z-index: 2; }
</style>
</head>
<body>

<div class="app-container">
  
  <div class="px-5 pt-10 pb-[100px] flex flex-col gap-7">
    
    <div class="flex items-center justify-between">
      <button class="w-[46px] h-[46px] rounded-full bg-white flex items-center justify-center text-[#101112]">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <h1 class="text-[17px] font-semibold text-[#101112]">Home</h1>
      <button class="w-[46px] h-[46px] rounded-full bg-white flex items-center justify-center text-[#101112]">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="-ml-1 -mt-1">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

    <div class="bg-white rounded-[32px] p-6 relative anim-profile shadow-sm">
      <div class="flex items-start justify-between">
        <div class="mt-2">
          <p class="text-[15px] text-[#101112] font-medium leading-tight">Business</p>
          <p class="text-[14px] text-[#9A9EA6] font-normal mt-0.5">profile</p>
        </div>
        <div class="relative w-[84px] h-[84px] rounded-full p-1 bg-white ml-2">
          <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?ixlib=rb-1.2.1&auto=format&fit=crop&w=256&q=80" alt="Robert Fox" class="w-full h-full rounded-full object-cover" />
        </div>
        <div class="text-right mt-1">
          <p class="text-[34px] font-semibold text-[#101112] leading-none tracking-tight">36+</p>
          <p class="text-[12px] font-normal text-[#9A9EA6] mt-1.5">Connected</p>
        </div>
      </div>
      
      <div class="text-center mt-3">
        <h2 class="text-[22px] font-semibold text-[#101112]">Robert Fox</h2>
        <p class="text-[13px] text-[#9A9EA6] mt-1 font-normal">CEO at Orbix Design studio</p>
      </div>

      <div class="border-t border-gray-100 mt-6 pt-5 flex items-center justify-between">
        <span class="text-[14px] font-normal text-[#9A9EA6]">Your Links</span>
        <div class="flex items-center gap-2.5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101112" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span class="text-[14px] text-[#101112] font-medium mr-1">Direct</span>
          <div class="relative inline-block w-[44px] h-[26px] align-middle select-none">
            <input type="checkbox" name="toggle" id="toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white appearance-none cursor-pointer opacity-0" checked/>
            <label for="toggle" class="toggle-label block overflow-hidden cursor-pointer"></label>
            <div class="toggle-thumb cursor-pointer pointer-events-none"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="relative flex justify-between items-center z-10 anim-add-new mt-2">
      <div class="max-w-[190px]">
        <h3 class="text-[18px] font-medium text-[#101112]">Add New</h3>
        <p class="text-[13px] text-[#9A9EA6] mt-1 font-normal leading-[1.4]">Add new link as a business or personal branding</p>
      </div>
      
      <div class="relative w-[70px] h-[70px] flex items-center justify-center mr-2">
        <button class="radar-btn w-[64px] h-[64px] rounded-full bg-white flex items-center justify-center text-[#101112] shadow-sm">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 items-stretch anim-cards">
      
      <div class="flex flex-col gap-4 h-full">
        <div class="bg-white rounded-[28px] p-5 flex-1 flex flex-col justify-between shadow-sm">
          
          <div class="flex -space-x-2 overflow-hidden py-1">
            <div class="w-[28px] h-[28px] rounded-full bg-[#E60023] ring-[2px] ring-white flex items-center justify-center text-white relative z-[5]">
              <i class="fa-brands fa-pinterest-p text-[14px]"></i>
            </div>
            <div class="w-[28px] h-[28px] rounded-full bg-[#FFFC00] ring-[2px] ring-white flex items-center justify-center text-black relative z-[4]">
              <i class="fa-brands fa-snapchat text-[14px]"></i>
            </div>
            <div class="w-[28px] h-[28px] rounded-full bg-[#1DA1F2] ring-[2px] ring-white flex items-center justify-center text-white relative z-[3]">
              <i class="fa-brands fa-twitter text-[13px]"></i>
            </div>
            <div class="w-[28px] h-[28px] rounded-full bg-[#0A66C2] ring-[2px] ring-white flex items-center justify-center text-white relative z-[2]">
              <i class="fa-brands fa-linkedin-in text-[13px]"></i>
            </div>
            <div class="w-[28px] h-[28px] rounded-full bg-[#1877F2] ring-[2px] ring-white flex items-center justify-center text-white relative z-[1]">
              <i class="fa-brands fa-facebook-f text-[14px]"></i>
            </div>
          </div>
          
          <div class="mt-4 pt-1">
            <p class="text-[32px] font-semibold text-[#101112] leading-none tracking-tight">05</p>
            <p class="text-[12px] text-[#9A9EA6] font-normal mt-1.5">Active social link</p>
          </div>
        </div>
        
        <button class="bg-[#C8F331] hover:bg-[#bde829] transition-colors rounded-[24px] h-[60px] w-full flex items-center justify-center gap-2 font-medium text-[14px] text-[#101112] shadow-sm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h12l4 6-10 13L2 9Z"></path>
            <path d="M11 3 8 9l4 13"></path>
            <path d="M12 3v19"></path>
            <path d="M13 3l3 6-4 13"></path>
          </svg>
          Upgrade now
        </button>
      </div>

      <div class="bg-white rounded-[28px] p-5 h-full flex flex-col shadow-sm">
        <h4 class="text-[13px] font-semibold text-[#101112] mb-4 mt-1">Recent connected</h4>
        <div class="flex flex-col gap-[14px] flex-1">
          
          <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?ixlib=rb-1.2.1&auto=format&fit=crop&w=128&q=80" alt="Bessie" class="w-[30px] h-[30px] rounded-full object-cover flex-shrink-0" />
              <div class="min-w-0 flex-1">
                <p class="text-[12px] font-semibold text-[#101112] truncate">Bessie</p>
                <p class="text-[10px] text-[#9A9EA6] font-normal truncate mt-0.5">Los Angeles, CA</p>
              </div>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
              <circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle>
            </svg>
          </div>
          
          <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=128&q=80" alt="Julie" class="w-[30px] h-[30px] rounded-full object-cover flex-shrink-0" />
              <div class="min-w-0 flex-1">
                <p class="text-[12px] font-semibold text-[#101112] truncate">Julie</p>
                <p class="text-[10px] text-[#9A9EA6] font-normal truncate mt-0.5">Los Angeles, CA</p>
              </div>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
              <circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle>
            </svg>
          </div>
          
          <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=128&q=80" alt="Regina" class="w-[30px] h-[30px] rounded-full object-cover flex-shrink-0" />
              <div class="min-w-0 flex-1">
                <p class="text-[12px] font-semibold text-[#101112] truncate">Regina</p>
                <p class="text-[10px] text-[#9A9EA6] font-normal truncate mt-0.5">Los Angeles, CA</p>
              </div>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
              <circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle>
            </svg>
          </div>

        </div>
      </div>
    </div>

  </div>

  <div class="absolute bottom-5 left-5 right-5 bg-white/85 backdrop-blur-xl border border-white/60 rounded-full px-5 py-2.5 flex items-center justify-between z-50 shadow-[0_8px_24px_rgba(0,0,0,0.05)] anim-nav">
    
    <a href="#" class="navbtn active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#C8F331" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
    </a>

    <a href="#" class="navbtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        <path d="M14 14h7v7h-7z"></path>
        <path d="M14 18h7"></path>
        <path d="M18 14v7"></path>
      </svg>
    </a>

    <a href="#" class="w-[44px] h-[44px] bg-[#1a1b1e] rounded-full flex items-center justify-center transition hover:scale-105 shadow-md">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c8f331" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
    </a>

    <a href="#" class="navbtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="8" width="4" height="13" rx="1"></rect>
        <rect x="10" y="4" width="4" height="17" rx="1"></rect>
        <rect x="4" y="12" width="4" height="9" rx="1"></rect>
      </svg>
    </a>

    <a href="#" class="navbtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </a>
  </div>

</div>

</body>
