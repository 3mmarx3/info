<!-- index.html (صفحة البروفايل) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbix — Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c8f331;
    --ink: #0d0e10;
    --bg: #f4f5f7;
  }
  * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
  body { background: #e5e7eb; margin: 0; }
  
  .app-container {
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
  }
  
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
    padding-bottom: 110px;
  }
  .scroll-area::-webkit-scrollbar { display: none; }
  
  .toggle {
    width: 44px; height: 26px; border-radius: 999px; position: relative; transition: .2s; cursor: pointer;
    border: none; outline: none;
  }
  .toggle .knob {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle.on .knob { left: 21px; }
  .toggle.off { background: #e3e5e9; }
  
  .card-shadow { box-shadow: 0 1px 2px rgba(16,17,18,.04), 0 8px 24px rgba(16,17,18,.05); }
  .navbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b7bac0; text-decoration: none; }
  .navbtn.active { color: #101112; }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Status Bar -->
  <div class="px-7 pt-4 pb-1 flex items-center justify-between text-[15px] font-semibold text-[#101112]">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#101112"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#101112"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#101112"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#101112"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.6a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8z" fill="#101112"/><path d="M8 6.4c-1.7 0-3.3.6-4.6 1.7l1.3 1.5A5 5 0 018 8.4c1.3 0 2.5.4 3.4 1.2l1.3-1.5A6.9 6.9 0 008 6.4z" fill="#101112"/><path d="M8 2.8c-2.7 0-5.2 1-7.1 2.7l1.3 1.5A8.7 8.7 0 018 5c2.1 0 4 .7 5.5 2l1.3-1.5C12.9 3.7 10.6 2.8 8 2.8z" fill="#101112"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#101112"/><rect x="2" y="2" width="18" height="8" rx="1.3" fill="#101112"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="#101112"/></svg>
    </div>
  </div>

  <div class="scroll-area px-5 pt-1">
    
    <!-- Top Bar -->
    <div class="flex items-center justify-between py-3">
      <button class="w-10 h-10 rounded-full bg-white card-shadow flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke="#101112" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="#101112" stroke-width="1.7"/></svg>
      </button>
      <h1 class="text-[17px] font-bold text-[#101112]">Home</h1>
      <button class="w-10 h-10 rounded-full bg-white card-shadow flex items-center justify-center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 11.5l17.5-8-6.5 18-3.8-8.2L3 11.5z" stroke="#101112" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- Business Profile Card -->
    <div class="bg-white rounded-[28px] card-shadow px-5 pt-5 pb-1 mt-1">
      <div class="flex items-start justify-between">
        <p class="text-[13px] text-[#9a9ea6] leading-tight mt-2">Business<br/>profile</p>
        <div class="flex flex-col items-center">
          <img src="https://i.pravatar.cc/120?img=13" class="w-16 h-16 rounded-full object-cover ring-4 ring-white" />
        </div>
        <div class="text-right mt-1">
          <p class="text-[22px] font-extrabold text-[#101112] leading-none">36+</p>
          <p class="text-[12px] text-[#9a9ea6] mt-1">Connected</p>
        </div>
      </div>
      <div class="text-center mt-2">
        <h2 class="text-[20px] font-extrabold text-[#101112]">Robert Fox</h2>
        <p class="text-[13px] text-[#9a9ea6] mt-0.5">CEO at Orbix Design studio</p>
      </div>

      <div class="border-t border-[#eef0f2] mt-4 flex items-center justify-between py-4">
        <span class="text-[14px] font-semibold text-[#101112]">Your Links</span>
        <div class="flex items-center gap-2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#c7cad0" stroke-width="1.6"/><path d="M12 11v5" stroke="#c7cad0" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="8" r="1" fill="#c7cad0"/></svg>
          <span class="text-[14px] text-[#101112] font-medium">Direct</span>
          <button id="direct-toggle" class="toggle on"><span class="knob"></span></button>
        </div>
      </div>
    </div>

    <!-- Add New -->
    <div class="bg-white rounded-[28px] card-shadow px-5 py-5 mt-3.5 flex items-center justify-between overflow-hidden relative">
      <div class="max-w-[58%]">
        <h3 class="text-[16px] font-extrabold text-[#101112]">Add New</h3>
        <p class="text-[12.5px] text-[#9a9ea6] mt-1 leading-snug">Add new link as a business or personal branding</p>
      </div>
      <div class="relative flex items-center justify-center w-24 h-20 shrink-0">
        <svg width="60" height="72" viewBox="0 0 60 72" fill="none" class="opacity-90">
          <rect x="6" y="4" width="20" height="30" rx="10" fill="#eef0f2"/>
          <rect x="30" y="20" width="20" height="30" rx="10" fill="#eef0f2"/>
          <circle cx="16" cy="10" r="3" fill="#c8f331"/>
          <circle cx="40" cy="26" r="3" fill="#c8f331"/>
        </svg>
        <button class="absolute -bottom-1 -right-1 w-11 h-11 rounded-full bg-[#101112] flex items-center justify-center shadow-lg shadow-lime-300/40">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#c8f331" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Socials & Recent -->
    <div class="grid grid-cols-2 gap-3.5 mt-3.5">
      <div class="bg-white rounded-[28px] card-shadow px-4 py-5 flex flex-col justify-between">
        <div class="flex -space-x-2">
          <div class="w-7 h-7 rounded-full bg-[#E60023] ring-2 ring-white flex items-center justify-center text-white text-[11px] font-bold">P</div>
          <div class="w-7 h-7 rounded-full bg-[#FFFC00] ring-2 ring-white flex items-center justify-center text-black text-[11px] font-bold">S</div>
          <div class="w-7 h-7 rounded-full bg-[#1DA1F2] ring-2 ring-white flex items-center justify-center text-white text-[11px] font-bold">t</div>
          <div class="w-7 h-7 rounded-full bg-[#0A66C2] ring-2 ring-white flex items-center justify-center text-white text-[11px] font-bold">in</div>
          <div class="w-7 h-7 rounded-full bg-[#1877F2] ring-2 ring-white flex items-center justify-center text-white text-[11px] font-bold">f</div>
        </div>
        <div class="mt-4">
          <p class="text-[24px] font-extrabold text-[#101112]">05</p>
          <p class="text-[12px] text-[#9a9ea6] mt-0.5">Active social link</p>
        </div>
      </div>

      <div class="bg-white rounded-[28px] card-shadow px-4 py-4">
        <p class="text-[13px] font-bold text-[#101112] mb-3">Recent connected</p>
        <div class="space-y-3">
          <div class="flex items-center gap-2">
            <img src="https://i.pravatar.cc/60?img=32" class="w-8 h-8 rounded-full object-cover"/>
            <div class="leading-tight flex-1 min-w-0">
              <p class="text-[12.5px] font-semibold text-[#101112] truncate">Bessie</p>
              <p class="text-[10.5px] text-[#9a9ea6] truncate">Los Angeles, CA</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <img src="https://i.pravatar.cc/60?img=45" class="w-8 h-8 rounded-full object-cover"/>
            <div class="leading-tight flex-1 min-w-0">
              <p class="text-[12.5px] font-semibold text-[#101112] truncate">Julie</p>
              <p class="text-[10.5px] text-[#9a9ea6] truncate">Los Angeles, CA</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <img src="https://i.pravatar.cc/60?img=48" class="w-8 h-8 rounded-full object-cover"/>
            <div class="leading-tight flex-1 min-w-0">
              <p class="text-[12.5px] font-semibold text-[#101112] truncate">Regina</p>
              <p class="text-[10.5px] text-[#9a9ea6] truncate">Los Angeles, CA</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Upgrade -->
    <button class="w-full mt-3.5 mb-5 bg-[#c8f331] hover:bg-[#bce622] transition rounded-full py-4 flex items-center justify-center gap-2 font-bold text-[15px] text-[#101112]">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3h12l3 6-9 12L3 9l3-6z" stroke="#101112" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 9h18M9 3l3 18M15 3l-3 18" stroke="#101112" stroke-width="1.2"/></svg>
      Upgrade now
    </button>
  </div>

  <!-- Bottom Nav -->
  <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] px-6 pt-3 pb-7 flex items-center justify-between shadow-[0_-8px_24px_rgba(16,17,18,0.06)]">
    <a href="index.html" class="navbtn active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
    </a>

    <a href="#" class="navbtn">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>

    <a href="credit.html" class="bg-[#101112] text-white rounded-full px-5 py-3 flex items-center gap-2 -mt-1 no-underline transition hover:scale-105">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="#c8f331" stroke-width="1.7"/><path d="M3 10h18" stroke="#c8f331" stroke-width="1.7"/></svg>
      <span class="text-[13px] font-semibold">Cards</span>
    </a>

    <a href="#" class="navbtn">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V20a2 2 0 11-4 0v-.2a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H4a2 2 0 110-4h.2a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H10a1.7 1.7 0 001-1.6V4a2 2 0 114 0v.2a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V10a1.7 1.7 0 001.6 1H20a2 2 0 110 4h-.2a1.7 1.7 0 00-1.6 1z" stroke="currentColor" stroke-width="1.4"/></svg>
    </a>

    <a href="#" class="navbtn">
      <img src="https://i.pravatar.cc/60?img=13" class="w-6 h-6 rounded-full object-cover ring-2 ring-[#eef0f2]"/>
    </a>
  </div>

</div>

<script>
  document.getElementById('direct-toggle').addEventListener('click', function(){
    this.classList.toggle('on');
    this.classList.toggle('off');
  });
</script>
</body>
</html>
